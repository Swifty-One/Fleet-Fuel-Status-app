<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fleet Fuel Tracker | Flight Ops</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cockpit: '#0b1120',
            card: '#1e293b',
            accent: '#0284c7'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen pb-16 antialiased selection:bg-sky-500 selection:text-white">

  <!-- Sticky Top Header -->
  <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur border-b border-slate-800 px-4 py-3">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div>
        <div class="flex items-center gap-2">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse" id="syncStatusDot"></span>
          <h1 class="text-base font-bold tracking-tight text-white uppercase">Fleet Fuel Status</h1>
        </div>
        <p class="text-[11px] text-slate-400" id="syncStatusText">Connecting to live fleet...</p>
      </div>

      <!-- Quick Force Refresh Button -->
      <button onclick="loadFleetData()" title="Refresh" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs border border-slate-700">
        🔄
      </button>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- Quick Stats Overview Bar -->
    <div class="grid grid-cols-2 gap-3 text-xs">
      <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl">
        <span class="text-slate-400 block text-[10px] uppercase font-semibold">Active Airframes</span>
        <span class="text-lg font-bold text-sky-400" id="totalAircraft">--</span>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl">
        <span class="text-slate-400 block text-[10px] uppercase font-semibold">Last Reported By</span>
        <span class="text-sm font-semibold text-slate-200 truncate block" id="lastReporter">--</span>
      </div>
    </div>

    <!-- Aircraft Fleet Card List -->
    <div id="fleetContainer" class="space-y-3">
      <!-- Loading Skeleton -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 animate-pulse space-y-3">
        <div class="h-4 bg-slate-800 rounded w-1/3"></div>
        <div class="h-8 bg-slate-800 rounded"></div>
        <div class="h-3 bg-slate-800 rounded w-1/2"></div>
      </div>
    </div>

  </main>

  <!-- Bottom Sheet / Modal: Log Fuel After Flight -->
  <div id="logModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-end sm:items-center justify-center hidden p-0 sm:p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-t-3xl sm:rounded-2xl w-full max-w-md p-5 space-y-4 shadow-2xl">
      
      <div class="flex items-center justify-between pb-2 border-b border-slate-800">
        <div>
          <h2 class="text-base font-bold text-white flex items-center gap-2">
            <span>⛽ Log Post-Flight Fuel</span>
          </h2>
          <p class="text-xs text-sky-400 font-mono font-bold" id="modalTail">LN-???</p>
        </div>
        <button onclick="closeLogModal()" class="text-slate-400 hover:text-white text-lg p-1.5">&times;</button>
      </div>

      <form id="fuelForm" onsubmit="submitFuelLog(event)" class="space-y-4 text-xs">
        
        <!-- Fuel Input with Dual Units -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="font-medium text-slate-300">Remaining Fuel Onboard</label>
            <div class="flex bg-slate-950 p-0.5 rounded-lg border border-slate-800 text-[10px]">
              <button type="button" id="unitLitersBtn" onclick="switchInputUnit('L')" class="px-2 py-0.5 rounded bg-sky-600 font-bold text-white">LITERS</button>
              <button type="button" id="unitGallonsBtn" onclick="switchInputUnit('G')" class="px-2 py-0.5 rounded text-slate-400 font-bold">US GAL</button>
            </div>
          </div>
          
          <div class="relative">
            <input id="fuelInput" type="number" step="0.5" required placeholder="0.0" oninput="syncDualUnitDisplay()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-base font-mono font-bold text-white focus:outline-none focus:border-sky-500">
            <span id="unitSuffix" class="absolute right-3.5 top-2.5 text-slate-500 font-mono text-sm">L</span>
          </div>
          <p class="text-[11px] text-slate-400 mt-1" id="convertedAltDisplay">≈ 0.0 US Gallons</p>
        </div>

        <!-- Pilot Name -->
        <div>
          <label class="font-medium text-slate-300 block mb-1">Logged By (Pilot Name / Initials)</label>
          <input id="pilotInput" type="text" required placeholder="e.g. Martin S." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500">
        </div>

        <div class="pt-2 flex gap-2">
          <button type="button" onclick="closeLogModal()" class="w-1/3 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 font-semibold text-slate-300">Cancel</button>
          <button type="submit" id="saveBtn" class="w-2/3 py-2.5 rounded-xl bg-sky-600 hover:bg-sky-500 font-bold text-white tracking-wide shadow-lg shadow-sky-600/30">Save & Sync</button>
        </div>

      </form>
    </div>
  </div>

  <script>
    // Embedded Supabase Live Credentials
    const SUPABASE_URL = "https://hucirsddeetvdsomjlrr.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh1Y2lyc2RkZWV0dmRzb21qbHJyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4OTAyNDUsImV4cCI6MjEwMjQ2NjI0NX0.VIVcJVJi-J7l3zK14qIfVT_bll7We9sSbXf34KiIRn4";

    const LTR_TO_GAL = 0.264172;
    const GAL_TO_LTR = 3.78541;

    let supabaseClient = null;
    let fleetState = [];
    let activeEditTail = null;
    let inputMode = 'L';

    window.addEventListener('DOMContentLoaded', () => {
      initSupabase();
      loadFleetData();
      setInterval(renderFleetList, 60000);
    });

    function initSupabase() {
      if (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase) {
        try {
          supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          document.getElementById('syncStatusDot').className = "inline-block w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-sm shadow-emerald-400";
          document.getElementById('syncStatusText').textContent = "Live Cloud Sync Active";

          // Subscribe to Realtime database updates
          supabaseClient
            .channel('public:fleet_fuel')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'fleet_fuel' }, () => {
              loadFleetData();
            })
            .subscribe();

          return;
        } catch (e) {
          console.error("Supabase Init Error", e);
        }
      }

      document.getElementById('syncStatusDot').className = "inline-block w-2.5 h-2.5 rounded-full bg-red-500";
      document.getElementById('syncStatusText').textContent = "Connection error";
    }

    async function loadFleetData() {
      if (supabaseClient) {
        const { data, error } = await supabaseClient.from('fleet_fuel').select('*').order('tail');
        if (!error && data && data.length > 0) {
          fleetState = data;
          renderFleetList();
          return;
        }
      }
    }

    function renderFleetList() {
      const container = document.getElementById('fleetContainer');
      container.innerHTML = '';

      document.getElementById('totalAircraft').textContent = `${fleetState.length} Aircraft`;
      
      const sortedByDate = [...fleetState].sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
      if (sortedByDate.length > 0) {
        const newest = sortedByDate[0];
        document.getElementById('lastReporter').textContent = `${newest.pilot_name || 'Anonymous'} (${formatRelativeTime(newest.updated_at)})`;
      }

      fleetState.forEach(ac => {
        const liters = parseFloat(ac.fuel_liters);
        const maxLiters = parseFloat(ac.max_liters);
        const gallons = (liters * LTR_TO_GAL).toFixed(1);
        const maxGallons = (maxLiters * LTR_TO_GAL).toFixed(1);
        const pct = Math.min(100, Math.max(0, Math.round((liters / maxLiters) * 100)));

        const hoursTotal = liters / ac.burn_rate_lph;
        const endHours = Math.floor(hoursTotal);
        const endMinutes = Math.round((hoursTotal - endHours) * 60);

        let barColor = 'bg-emerald-500';
        let badgeColor = 'text-emerald-400 border-emerald-500/30 bg-emerald-500/10';
        if (pct < 35) {
          barColor = 'bg-red-500';
          badgeColor = 'text-red-400 border-red-500/30 bg-red-500/10';
        } else if (pct < 60) {
          barColor = 'bg-amber-500';
          badgeColor = 'text-amber-400 border-amber-500/30 bg-amber-500/10';
        }

        const card = document.createElement('div');
        card.className = "bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3 shadow-lg relative overflow-hidden";
        card.innerHTML = `
          <div class="flex items-start justify-between">
            <div>
              <div class="flex items-center gap-2">
                <span class="text-base font-black tracking-wider text-white font-mono">${ac.tail}</span>
                <span class="px-2 py-0.5 text-[10px] font-bold rounded-full border ${badgeColor}">${pct}% FULL</span>
              </div>
              <p class="text-xs text-slate-400">${ac.model} · Cruise burn ≈ ${ac.burn_rate_lph} L/h</p>
            </div>
            
            <button onclick="openLogModal('${ac.tail}')" class="px-3 py-1.5 bg-sky-600/20 border border-sky-500/30 hover:bg-sky-600 hover:text-white text-sky-300 font-semibold rounded-xl text-xs flex items-center gap-1 transition">
              <span>⛽ Update</span>
            </button>
          </div>

          <!-- Fuel Progress Bar -->
          <div class="space-y-1">
            <div class="flex justify-between text-xs font-mono font-bold">
              <span class="text-slate-100 text-sm">${liters} L <span class="text-slate-400 text-xs font-normal">(${gallons} USG)</span></span>
              <span class="text-slate-400 text-xs">Max ${maxLiters} L (${maxGallons} USG)</span>
            </div>
            <div class="w-full bg-slate-950 rounded-full h-3 p-0.5 border border-slate-800">
              <div class="${barColor} h-2 rounded-full transition-all duration-500" style="width: ${pct}%"></div>
            </div>
          </div>

          <!-- Safe Endurance Readout -->
          <div class="pt-1 text-[11px] flex justify-between items-center border-t border-slate-800/80">
            <span class="text-slate-400">Est. Safe Endurance:</span>
            <span class="font-bold text-sky-300 font-mono">⏱ ${endHours}h ${String(endMinutes).padStart(2, '0')}m <span class="text-[10px] text-slate-400 font-normal">to dry tanks</span></span>
          </div>

          <!-- Timestamp & Reporter Footer -->
          <div class="flex items-center justify-between text-[10px] text-slate-400 pt-1">
            <span>Logged by: <strong class="text-slate-300">${ac.pilot_name || 'Pilot'}</strong></span>
            <span>🕒 ${formatRelativeTime(ac.updated_at)}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function formatRelativeTime(isoString) {
      if (!isoString) return 'Just now';
      const seconds = Math.floor((Date.now() - new Date(isoString).getTime()) / 1000);
      
      if (seconds < 60) return 'Just now';
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes}m ago`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours}h ago`;
      const days = Math.floor(hours / 24);
      return `${days}d ago`;
    }

    function openLogModal(tail) {
      activeEditTail = tail;
      const ac = fleetState.find(a => a.tail === tail);
      if (!ac) return;

      document.getElementById('modalTail').textContent = `${ac.tail} (${ac.model})`;
      document.getElementById('fuelInput').value = inputMode === 'L' ? ac.fuel_liters : (ac.fuel_liters * LTR_TO_GAL).toFixed(1);
      document.getElementById('pilotInput').value = localStorage.getItem('last_pilot_name') || '';

      syncDualUnitDisplay();
      document.getElementById('logModal').classList.remove('hidden');
    }

    function closeLogModal() {
      document.getElementById('logModal').classList.add('hidden');
    }

    function switchInputUnit(unit) {
      inputMode = unit;
      const val = parseFloat(document.getElementById('fuelInput').value) || 0;

      if (unit === 'L') {
        document.getElementById('unitLitersBtn').className = "px-2 py-0.5 rounded bg-sky-600 font-bold text-white";
        document.getElementById('unitGallonsBtn').className = "px-2 py-0.5 rounded text-slate-400 font-bold";
        document.getElementById('unitSuffix').textContent = "L";
        document.getElementById('fuelInput').value = (val * GAL_TO_LTR).toFixed(1);
      } else {
        document.getElementById('unitGallonsBtn').className = "px-2 py-0.5 rounded bg-sky-600 font-bold text-white";
        document.getElementById('unitLitersBtn').className = "px-2 py-0.5 rounded text-slate-400 font-bold";
        document.getElementById('unitSuffix').textContent = "GAL";
        document.getElementById('fuelInput').value = (val * LTR_TO_GAL).toFixed(1);
      }
      syncDualUnitDisplay();
    }

    function syncDualUnitDisplay() {
      const val = parseFloat(document.getElementById('fuelInput').value) || 0;
      const display = document.getElementById('convertedAltDisplay');
      if (inputMode === 'L') {
        display.textContent = `≈ ${(val * LTR_TO_GAL).toFixed(1)} US Gallons`;
      } else {
        display.textContent = `≈ ${(val * GAL_TO_LTR).toFixed(1)} Liters`;
      }
    }

    async function submitFuelLog(e) {
      e.preventDefault();
      const rawFuel = parseFloat(document.getElementById('fuelInput').value);
      const pilot = document.getElementById('pilotInput').value.trim();

      if (isNaN(rawFuel)) return;
      localStorage.setItem('last_pilot_name', pilot);

      const fuelInLiters = inputMode === 'L' ? rawFuel : Math.round(rawFuel * GAL_TO_LTR * 10) / 10;
      const timestamp = new Date().toISOString();

      document.getElementById('saveBtn').disabled = true;
      document.getElementById('saveBtn').textContent = "Saving...";

      if (supabaseClient) {
        const { error } = await supabaseClient
          .from('fleet_fuel')
          .update({
            fuel_liters: fuelInLiters,
            pilot_name: pilot,
            updated_at: timestamp
          })
          .eq('tail', activeEditTail);

        if (error) alert("Sync error: " + error.message);
      }

      document.getElementById('saveBtn').disabled = false;
      document.getElementById('saveBtn').textContent = "Save & Sync";
      closeLogModal();
      loadFleetData();
    }
  </script>
</body>
</html>
